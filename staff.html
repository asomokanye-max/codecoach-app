<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CodeCoach · Tutor and admin</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--blue:#1F4E79;--blue2:#2E75B6;--bg:#f5f7fa;--card:#fff;--ink:#1d2430;--mut:#5b6575;--ok:#1e7a46;--okbg:#e6f4ec;--bad:#b3261e;--badbg:#fbe9e7;--line:#dde3ea}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink);line-height:1.45}
header{background:var(--blue);color:#fff;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
header h1{margin:0;font-size:1.15rem}header .who{font-size:.8rem;opacity:.95}
header a{color:#fff;font-size:.8rem;margin-left:10px}
main{max-width:1000px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:14px;overflow-x:auto}
h2{font-size:1.05rem;margin:0 0 10px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
button{font-size:.88rem;padding:8px 13px;border-radius:8px;border:0;background:var(--blue);color:#fff;cursor:pointer;font-weight:600}
button.sec{background:#e8eef5;color:var(--blue)}button.sm{font-size:.78rem;padding:6px 10px}button:disabled{opacity:.5}
table{width:100%;border-collapse:collapse;font-size:.86rem}th,td{text-align:left;padding:6px;border-bottom:1px solid var(--line);vertical-align:top}th{color:var(--mut);font-weight:600}
input[type=text],select,textarea{font-size:.88rem;padding:6px 8px;border:1px solid #b9c3cf;border-radius:6px;font-family:inherit}
textarea{width:100%;min-height:60px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.tile{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 12px}.tile .n{font-size:1.5rem;font-weight:700;color:var(--blue)}.tile .l{font-size:.78rem;color:var(--mut)}
.bar{height:10px;border-radius:5px;background:#e3e8ee;overflow:hidden;min-width:60px}.bar>div{height:100%}
.hint{font-size:.8rem;color:var(--mut)}.ok{color:var(--ok);font-weight:600}.err{color:var(--bad);font-weight:600}
.item{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:10px}
.hidden{display:none}
</style>
</head>
<body>
<header><h1>CodeCoach · Tutor and admin</h1><div class="who"><span id="who"></span><a href="cases.html">Case workshop</a><a href="./">Student view</a></div></header>
<main>
  <div id="gate" class="card">Loading…</div>
  <div id="appArea" class="hidden">
    <div class="tabs">
      <button data-t="over">Class overview</button><button class="sec" data-t="users">Students and roles</button>
      <button class="sec" data-t="wrong">Wrong codes to explain</button><button class="sec" data-t="expl">Rate explanations</button>
      <button class="sec" data-t="cases">Case bank</button><button class="sec" data-t="tests">Tests</button><button class="sec" data-t="export">Export data</button>
    </div>
    <section id="t_over"></section>
    <section id="t_users" class="hidden"></section>
    <section id="t_wrong" class="hidden"></section>
    <section id="t_expl" class="hidden"></section>
    <section id="t_cases" class="hidden"></section>
    <section id="t_tests" class="hidden"></section>
    <section id="t_export" class="hidden"></section>
  </div>
</main>
<script>
const SUPABASE_URL="https://sdqnqbclwoqhouwuzaxv.supabase.co";
const SUPABASE_KEY="sb_publishable_g0h4KFaS1FivbcTjIOzZfg_6URb05m8";
const db=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let me=null,role=null,users=[],att=[];
const fmtDate=d=>d?new Date(d).toLocaleString("en-GB",{day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"}):"–";

async function start(){
  const {data}=await db.auth.getSession();me=data.session?.user||null;
  if(!me){$("gate").innerHTML='Please <a href="./">log in on the student page</a> first, then come back to this page.';return;}
  const {data:p}=await db.from("profiles").select("role,study_id").eq("id",me.id).maybeSingle();
  role=p?.role;$("who").textContent=me.email+" · "+(role||"");
  if(!role||role==="student"){$("gate").innerHTML='This page is for tutors and administrators. <a href="./">Go to the student view</a>.';return;}
  $("gate").classList.add("hidden");$("appArea").classList.remove("hidden");
  document.querySelectorAll("[data-t]").forEach(b=>b.onclick=()=>tab(b.dataset.t));
  await loadCore();tab("over");
}
async function loadCore(){
  const u=await db.rpc("staff_users");users=u.data||[];
  const a=await db.rpc("export_attempts");att=a.data||[];
}
function tab(t){document.querySelectorAll("[data-t]").forEach(b=>b.className=b.dataset.t===t?"":"sec");["over","users","wrong","expl","cases","tests","export"].forEach(x=>$("t_"+x).classList.toggle("hidden",x!==t));({over:rOver,users:rUsers,wrong:rWrong,expl:rExpl,cases:rCases,tests:rTests,export:rExport})[t]();}

// ---------- overview ----------
function rOver(){
  const st=att.filter(x=>x.role==="student");const students=users.filter(u=>u.role==="student");
  const acc=st.length?Math.round(st.filter(x=>x.is_correct).length/st.length*100)+"%":"–";
  let h=`<div class="tiles">${[[students.length,"Student accounts"],[students.filter(u=>u.consent_at).length,"Consented"],[students.filter(u=>u.study_id&&u.arm).length,"Enrolled (ID and group)"],[st.length,"Student attempts"],[acc,"Student accuracy"]].map(([n,l])=>`<div class="tile"><div class="n">${n}</div><div class="l">${l}</div></div>`).join("")}</div>`;
  const by={};st.forEach(x=>{const k=(x.classification||"ICD-10")+" · "+x.chapter;by[k]=by[k]||{n:0,ok:0};by[k].n++;if(x.is_correct)by[k].ok++;});
  const rows=Object.entries(by).sort((a,b)=>a[1].ok/a[1].n-b[1].ok/b[1].n);
  h+=`<div class="card"><h2>Class accuracy by chapter (students only)</h2><table><tr><th>Chapter</th><th>Correct / attempts</th><th style="width:35%"></th></tr>${rows.length?rows.map(([c,v])=>{const p=Math.round(v.ok/v.n*100);const col=p>=80?"#2e8b57":p>=50?"#d39b00":"#c0392b";return `<tr><td>${esc(c)}</td><td>${v.ok}/${v.n} (${p}%)</td><td><div class="bar"><div style="width:${p}%;background:${col}"></div></div></td></tr>`}).join(""):'<tr><td colspan="3">No student attempts yet.</td></tr>'}</table></div>`;
  const er={};st.forEach(x=>{if(x.error_type)er[x.error_type]=(er[x.error_type]||0)+1;});
  h+=`<div class="card"><h2>Common error types</h2><table>${Object.entries(er).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<tr><td>${esc(k)}</td><td>${v}</td></tr>`).join("")||"<tr><td>None yet.</td></tr>"}</table></div>`;
  const per={};st.forEach(x=>{const k=x.study_id||"(no ID)";per[k]=per[k]||{arm:x.arm,n:0,ok:0,solved:new Set(),hints:0,last:null};const r=per[k];r.n++;if(x.is_correct){r.ok++;r.solved.add(x.case_no);}if(x.hint_used)r.hints++;r.last=x.created_at;});
  h+=`<div class="card"><h2>Progress by student</h2><table><tr><th>Study ID</th><th>Group</th><th>Attempts</th><th>Accuracy</th><th>Cases solved</th><th>Hints</th><th>Last active</th></tr>${Object.entries(per).map(([k,r])=>`<tr><td>${esc(k)}</td><td>${esc(r.arm||"–")}</td><td>${r.n}</td><td>${Math.round(r.ok/r.n*100)}%</td><td>${r.solved.size}</td><td>${r.hints}</td><td>${fmtDate(r.last)}</td></tr>`).join("")||'<tr><td colspan="7">No student attempts yet.</td></tr>'}</table><p class="hint">Staff practice attempts are excluded. Students without a study ID appear as "(no ID)".</p></div>`;
  $("t_over").innerHTML=h;
}

// ---------- users ----------
function rUsers(){
  const admin=role==="admin";
  let h=`<div class="card"><h2>Students and roles</h2><p class="hint">${admin?"Enter each student's study ID and the trial group from the randomisation list prepared by the biostatistician, then click Save. Names are visible to admins only.":"Only administrators can change study IDs, groups and roles."}</p><table><tr><th>Email</th>${admin?"<th>Name</th>":""}<th>Consent</th><th>Study ID</th><th>Group</th><th>Role</th>${admin?"<th></th>":""}</tr>`;
  users.forEach((u,i)=>{h+=`<tr><td>${esc(u.email)}</td>${admin?`<td>${esc(u.full_name||"–")}</td>`:""}<td>${u.consent_at?"Yes":"No"}</td>`+
    (admin?`<td><input type="text" id="sid${i}" value="${esc(u.study_id||"")}" size="9"></td><td><select id="arm${i}"><option value="">–</option><option ${u.arm==="intervention"?"selected":""}>intervention</option><option ${u.arm==="control"?"selected":""}>control</option></select></td><td><select id="role${i}">${["student","tutor","author","admin"].map(r=>`<option ${u.role===r?"selected":""}>${r}</option>`).join("")}</select></td><td><button class="sm" data-save="${i}">Save</button> <button class="sm sec" data-reset="${i}">Reset password</button> <div id="st${i}" class="hint"></div></td>`
    :`<td>${esc(u.study_id||"–")}</td><td>${esc(u.arm||"–")}</td><td>${esc(u.role)}</td>`)+"</tr>";});
  h+="</table></div>";$("t_users").innerHTML=h;
  document.querySelectorAll("[data-save]").forEach(b=>b.onclick=async()=>{const i=+b.dataset.save,u=users[i];b.disabled=true;
    const {error}=await db.rpc("admin_set_profile",{p_user:u.id,p_study_id:$("sid"+i).value,p_arm:$("arm"+i).value||null,p_role:$("role"+i).value});
    b.disabled=false;$("st"+i).innerHTML=error?`<span class="err">${esc(error.message)}</span>`:'<span class="ok">Saved</span>';if(!error)await loadCore();});
  document.querySelectorAll("[data-reset]").forEach(b=>b.onclick=async()=>{const i=+b.dataset.reset,u=users[i];
    if(b.dataset.armed!=="1"){b.dataset.armed="1";b.textContent="Click again to confirm";$("st"+i).textContent="This will replace "+u.email+"'s password.";return;}
    b.dataset.armed="";b.textContent="Reset password";b.disabled=true;
    const temp=tempPassword();const {error}=await db.rpc("admin_reset_password",{p_user:u.id,p_temp:temp});b.disabled=false;
    $("st"+i).innerHTML=error?`<span class="err">${esc(error.message)}</span>`:`<span class="ok">Temporary password: <b style="font-size:1rem;letter-spacing:1px">${temp}</b></span><br>Give this to the student privately. They must choose a new password when they next log in.`;});
}
function tempPassword(){const c="ABCDEFGHJKMNPQRSTUVWXYZ23456789";const r=new Uint32Array(8);crypto.getRandomValues(r);let s="CC-";for(let k=0;k<8;k++){s+=c[r[k]%c.length];if(k===3)s+="-";}return s;}

// ---------- wrong codes ----------
async function rWrong(){
  $("t_wrong").innerHTML='<div class="card">Loading…</div>';
  const {data,error}=await db.rpc("unnoted_wrong_codes");
  if(error){$("t_wrong").innerHTML=`<div class="card err">${esc(error.message)}</div>`;return;}
  let h=`<div class="card"><h2>Wrong codes without a note</h2><p class="hint">These wrong answers were entered but have no specific explanation yet. Write a short note (why this code is wrong and what to do instead), or click <b>Draft with AI</b> to get a first draft. Always check and edit an AI draft against the ICD books or WHO browser before saving: students only see what you save.</p></div>`;
  h+=data.length?data.map((r,i)=>`<div class="item"><div><b>Case ${r.case_no}</b> · correct ${esc(r.correct_code)} · wrong code entered <b>${esc(r.wrong_code)}</b> (${r.times} time${r.times>1?"s":""})</div><div class="hint" style="margin:4px 0">${esc(r.case_text)}</div><textarea id="wn${i}" placeholder="Why is ${esc(r.wrong_code)} wrong here?"></textarea><div style="margin-top:6px"><button class="sm sec" data-ai="${i}">Draft with AI</button> <button class="sm" data-wn="${i}">Save note</button> <span id="ws${i}" class="hint"></span></div></div>`).join(""):'<div class="card">No unexplained wrong codes. Well done.</div>';
  $("t_wrong").innerHTML=h;
  document.querySelectorAll("[data-wn]").forEach(b=>b.onclick=async()=>{const i=+b.dataset.wn,r=data[i],note=$("wn"+i).value.trim();if(!note){$("ws"+i).innerHTML='<span class="err">Write a note first.</span>';return;}
    b.disabled=true;const draft=$("wn"+i).dataset.draft?+$("wn"+i).dataset.draft:null;
    const {error}=await db.rpc("save_wrong_note",{p_case:r.case_id,p_wrong:r.wrong_code,p_note:note,p_draft:draft});
    $("ws"+i).innerHTML=error?`<span class="err">${esc(error.message)}</span>`:`<span class="ok">Saved${draft?" (AI-assisted, checked by you)":""}. Students will now see this note.</span>`;if(error)b.disabled=false;});
  document.querySelectorAll("[id^=wn]").forEach(ta=>ta.addEventListener("input",()=>{const sb=document.querySelector(`[data-wn="${ta.id.slice(2)}"]`);if(sb)sb.disabled=false;}));
  document.querySelectorAll("[data-ai]").forEach(b=>b.onclick=async()=>{const i=+b.dataset.ai,r=data[i];
    b.disabled=true;$("ws"+i).textContent="Asking the AI for a draft…";
    const {data:res,error}=await db.functions.invoke("codecoach-explain",{body:{case_id:r.case_id,wrong_code:r.wrong_code}});
    b.disabled=false;
    let msg=error?error.message:(res&&res.error);
    if(error&&error.context&&typeof error.context.json==="function"){try{const j=await error.context.json();if(j&&j.error)msg=j.error;}catch(e){}}
    if(msg){$("ws"+i).innerHTML=`<span class="err">AI draft not available: ${esc(msg)}</span>`;return;}
    $("wn"+i).value=res.draft;$("wn"+i).dataset.draft=res.draft_id;
    {const sb=document.querySelector(`[data-wn="${i}"]`);if(sb)sb.disabled=false;}
    $("ws"+i).innerHTML='<span class="hint"><b>AI draft.</b> Check every code and statement, edit as needed, then click Save note.</span>';});
}

// ---------- explanations ----------
async function rExpl(){
  $("t_expl").innerHTML='<div class="card">Loading…</div>';
  const {data,error}=await db.rpc("staff_explanations");
  if(error){$("t_expl").innerHTML=`<div class="card err">${esc(error.message)}</div>`;return;}
  const n=data.filter(x=>x.tutor_rating!==null).length,ok=data.filter(x=>x.tutor_rating===2).length;
  const sumR=await db.rpc("ai_draft_summary");const su=(sumR.data||[])[0];
  let h=`<div class="card"><h2>Rate explanations shown to students</h2>${su?`<p class="hint">AI drafts: ${su.drafts} made, ${su.used} used (${su.used_edited} edited by a tutor, ${su.used_unedited} unedited). AI-assisted explanations shown to students: ${su.explanations_ai}; rated ${su.ai_rated}, rated correct ${su.ai_rated_correct}.</p>`:""}<p class="hint">Rate each explanation: 2 = correct, 1 = partly correct, 0 = wrong. Correct it if needed. Unrated items are listed first. Rated: ${n} of ${data.length}${n?`; rated correct: ${Math.round(ok/n*100)}%`:""}.</p></div>`;
  h+=data.length?data.map((e,i)=>`<div class="item"><div><b>Case ${e.case_no}</b> · student entered <b>${esc(e.code_entered)}</b> · source: ${esc(e.source)} · ${fmtDate(e.created_at)}</div><div style="margin:6px 0">${esc(e.text)}</div><div><select id="er${i}"><option value="">Rate…</option><option value="2" ${e.tutor_rating===2?"selected":""}>2 Correct</option><option value="1" ${e.tutor_rating===1?"selected":""}>1 Partly correct</option><option value="0" ${e.tutor_rating===0?"selected":""}>0 Wrong</option></select></div><textarea id="ec${i}" placeholder="Corrected explanation (optional)" style="margin-top:6px">${esc(e.corrected_text||"")}</textarea><div style="margin-top:6px"><button class="sm" data-er="${i}">Save rating</button> <span id="es${i}" class="hint"></span></div></div>`).join(""):'<div class="card">No explanations yet.</div>';
  $("t_expl").innerHTML=h;
  document.querySelectorAll("[data-er]").forEach(b=>b.onclick=async()=>{const i=+b.dataset.er,e=data[i],r=$("er"+i).value;if(r===""){$("es"+i).innerHTML='<span class="err">Choose a rating.</span>';return;}
    b.disabled=true;const {error}=await db.from("explanations").update({tutor_rating:+r,corrected_text:$("ec"+i).value.trim()||null,rated_by:me.id}).eq("id",e.id);
    b.disabled=false;$("es"+i).innerHTML=error?`<span class="err">${esc(error.message)}</span>`:'<span class="ok">Saved</span>';});
}

// ---------- cases ----------
async function rCases(){
  $("t_cases").innerHTML='<div class="card">Loading…</div>';
  const [c,k,w]=await Promise.all([db.rpc("staff_cases"),db.from("case_codes").select("case_id,code,is_primary"),db.from("wrong_code_notes").select("case_id,wrong_code")]);
  if(c.error){$("t_cases").innerHTML=`<div class="card err">${esc(c.error.message)}</div>`;return;}
  const codes={},notes={};(k.data||[]).forEach(x=>(codes[x.case_id]=codes[x.case_id]||[]).push(x.code));(w.data||[]).forEach(x=>(notes[x.case_id]=notes[x.case_id]||[]).push(x.wrong_code));
  const tries={};att.filter(x=>x.role==="student").forEach(x=>{tries[x.case_no]=tries[x.case_no]||{n:0,ok:0};tries[x.case_no].n++;if(x.is_correct)tries[x.case_no].ok++;});
  $("t_cases").innerHTML=`<div class="card"><h2>Case bank (${c.data.length} cases)</h2><p class="hint">To write, code or approve cases, open the <a href="cases.html">Case workshop</a>.</p><table><tr><th>No.</th><th>Case</th><th>Chapter / level</th><th>Accepted</th><th>Notes on wrong codes</th><th>Status</th><th>Student accuracy</th></tr>${c.data.map(x=>{const t=tries[x.case_no];return `<tr><td>${x.case_no}</td><td>${esc(x.case_text)}<div class="hint">Lead term: ${esc(x.lead_term||"–")}</div></td><td><b>${esc(x.classification||"ICD-10")}</b>${x.coding_mode==="full"?" · full coding":""}<br>${esc(x.chapter)}<br>${esc(x.difficulty)}</td><td>${x.key_text?esc(x.key_text):esc((codes[x.id]||[]).join(", "))}</td><td>${esc((notes[x.id]||[]).join(", ")||"–")}</td><td>${esc(x.status)}</td><td>${t?`${t.ok}/${t.n}`:"–"}</td></tr>`}).join("")}</table></div>`;
}

// ---------- export ----------
// ---------- tests ----------
async function rTests(){
  $("t_tests").innerHTML='<div class="card">Loading…</div>';
  const admin=role==="admin";
  const [st,sc]=await Promise.all([db.from("test_settings").select("*"),db.rpc("export_test_scores")]);
  if(st.error||sc.error){$("t_tests").innerHTML=`<div class="card err">${esc((st.error||sc.error).message)}</div>`;return;}
  const scores=sc.data||[];const stamp=new Date().toISOString().slice(0,10);
  let h=`<div class="card"><h2>Baseline and endline tests</h2><p class="hint">Each test has 20 items: per classification, 8 principal-diagnosis items and 2 full-coding items (10 ICD-10, 10 ICD-11). Marked automatically: principal items 1 = accepted code, 0.5 = right category, 0 = otherwise; full-coding items score the share of points earned (0–1). Total out of 20. Students do not see marks. Forms A and B are counterbalanced: a student who sits A at baseline sits B at endline. Only enrolled students (with study ID and group) can start.</p>
  <table><tr><th>Test</th><th>Status</th><th>Minutes</th><th>Started</th><th>Submitted</th><th>Form A / B</th>${admin?"<th></th>":""}</tr>`;
  ["baseline","endline"].forEach(o=>{const t=(st.data||[]).find(x=>x.occasion===o)||{};const r=scores.filter(x=>x.occasion===o&&x.role==="student");
    h+=`<tr><td><b>${o==="baseline"?"Baseline":"Endline"}</b></td><td>${t.is_open?'<span class="ok">Open</span>':"Closed"}</td><td>${admin?`<input type="text" id="min_${o}" value="${t.minutes||30}" size="3">`:t.minutes}</td><td>${r.length}</td><td>${r.filter(x=>x.submitted_at).length}</td><td>${r.filter(x=>x.form==="A").length} / ${r.filter(x=>x.form==="B").length}</td>${admin?`<td><button class="sm ${t.is_open?"sec":""}" data-tog="${o}" data-open="${t.is_open?0:1}">${t.is_open?"Close test":"Open test"}</button> <span id="tm_${o}" class="hint"></span></td>`:""}</tr>`;});
  h+=`</table><p class="hint">Open a test only during the supervised session, and close it when the session ends. Students who have started keep their own timer.</p></div>`;
  h+=`<div class="card"><h2>Results</h2><p><button id="tx1">Download scores (CSV)</button> <button class="sec" id="tx2">Download item responses (CSV)</button> <span id="txs" class="hint"></span></p><p class="hint">Scores: one row per student per test (total /20, ICD-10 /10, ICD-11 /10, exact matches, minutes used), by study ID and group, for the ANCOVA. Item responses: one row per item, for item analysis (difficulty, discrimination, reliability). No names are included.</p>
  <table><tr><th>Study ID</th><th>Group</th><th>Test</th><th>Form</th><th>Status</th><th>Answered</th><th>Score /20</th>${admin?"<th></th>":""}</tr>${scores.map((x,i)=>`<tr><td>${esc(x.study_id||"(staff)")}</td><td>${esc(x.arm||"–")}</td><td>${esc(x.occasion)}</td><td>${esc(x.form)}</td><td>${x.submitted_at?(x.auto_submitted?"Submitted (time up)":"Submitted"):"In progress"}</td><td>${x.n_answered}</td><td>${x.submitted_at?x.total_score:"–"}</td>${admin?`<td><button class="sm sec" data-rs="${i}">Reset</button> <span id="rs${i}" class="hint"></span></td>`:""}</tr>`).join("")||`<tr><td colspan="8">No one has started a test yet.</td></tr>`}</table>${admin?'<p class="hint">Reset deletes a student\'s sitting and answers so they can start again. Use it only for a technical failure, and record the reason.</p>':""}</div>`;
  h+=`<div class="card"><h2>Test items and answer keys</h2><p class="hint">For staff review only. All keys must be checked by expert coders before the baseline test is opened.</p><p><button class="sec sm" id="showItems">Show items</button></p><div id="itemList"></div></div>`;
  $("t_tests").innerHTML=h;
  document.querySelectorAll("[data-tog]").forEach(b=>b.onclick=async()=>{const o=b.dataset.tog,open=b.dataset.open==="1";
    if(b.dataset.armed!=="1"){b.dataset.armed="1";b.textContent="Click again to confirm";$("tm_"+o).textContent=open?"Students will be able to start now.":"No new students can start.";return;}
    const {error}=await db.rpc("admin_test_control",{p_occasion:o,p_open:open,p_minutes:parseInt($("min_"+o).value)||30});
    if(error){$("tm_"+o).innerHTML=`<span class="err">${esc(error.message)}</span>`;return;}rTests();});
  document.querySelectorAll("[data-rs]").forEach(b=>b.onclick=async()=>{const x=scores[+b.dataset.rs],i=b.dataset.rs;
    if(b.dataset.armed!=="1"){b.dataset.armed="1";b.textContent="Click again to reset";$("rs"+i).textContent="Answers will be deleted.";return;}
    const {error}=await db.rpc("admin_reset_sitting",{p_user:x.user_id,p_occasion:x.occasion});
    if(error){$("rs"+i).innerHTML=`<span class="err">${esc(error.message)}</span>`;return;}rTests();});
  $("tx1").onclick=async()=>{const {data,error}=await db.rpc("export_test_scores");if(error){$("txs").textContent=error.message;return;}
    download(`codecoach_test_scores_${stamp}.csv`,csv(data,["study_id","arm","role","occasion","form","started_at","submitted_at","auto_submitted","minutes_used","n_answered","total_score","icd10_score","icd11_score","exact_correct"]));$("txs").textContent=`Exported ${data.length} rows.`;};
  $("tx2").onclick=async()=>{const {data,error}=await db.rpc("export_test_responses");if(error){$("txs").textContent=error.message;return;}
    download(`codecoach_test_items_${stamp}.csv`,csv(data,["study_id","arm","role","occasion","form","item_no","classification","answer","mark","is_exact"]));$("txs").textContent=`Exported ${data.length} rows.`;};
  $("showItems").onclick=async()=>{const {data,error}=await db.rpc("staff_test_items");if(error){$("itemList").textContent=error.message;return;}
    $("itemList").innerHTML=`<table><tr><th>Form</th><th>No.</th><th>Item</th><th>Key</th></tr>${data.map(x=>`<tr><td>${x.form}</td><td>${x.item_no}</td><td><b>${esc(x.classification)}</b>${x.coding_mode==="full"?" · <b>full coding</b>":""} · ${esc(x.chapter)} · ${esc(x.difficulty)}<br>${esc(x.case_text)}</td><td>${esc(x.accepted_codes)}</td></tr>`).join("")}</table>`;};
}

function csv(rows,cols){const q=v=>{v=v===null||v===undefined?"":String(v);return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;};return [cols.join(","),...rows.map(r=>cols.map(c=>q(r[c])).join(","))].join("\r\n");}
function download(name,text){const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([text],{type:"text/csv"}));a.download=name;document.body.appendChild(a);a.click();a.remove();}
function rExport(){
  const stamp=new Date().toISOString().slice(0,10);
  $("t_export").innerHTML=`<div class="card"><h2>Export data for analysis</h2><p class="hint">Files contain study IDs, never names. Store them in the encrypted study folder. Import into Stata with: <code>import delimited using "filename.csv", clear varnames(1)</code></p>
  <p><button id="x1">Download all attempts (CSV)</button></p><p><button id="x2" class="sec">Download participant list without names (CSV)</button></p><div id="xs" class="hint"></div></div>`;
  $("x1").onclick=async()=>{await loadCore();download(`codecoach_attempts_${stamp}.csv`,csv(att,["attempt_id","study_id","arm","role","case_no","classification","coding_mode","chapter","difficulty","code_entered","is_correct","error_type","score","max_score","hint_used","seconds","created_at"]));$("xs").textContent=`Exported ${att.length} attempts.`;};
  $("x2").onclick=async()=>{await loadCore();download(`codecoach_participants_${stamp}.csv`,csv(users,["study_id","arm","role","consent_at","created_at"]));$("xs").textContent=`Exported ${users.length} accounts.`;};
}
start();
</script>
</body>
